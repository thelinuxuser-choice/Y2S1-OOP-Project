<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gate — parkED</title>
  <link rel="stylesheet" href="css/app.css?v=10" />
  <script src="js/loader.js?v=9"></script>
</head>
<body>
  <div class="staff-shell">
    <header class="top-simple" data-reveal>
      <div class="brand">park<em>ED</em> <span class="text-muted text-sm" style="font-weight:600"> · Gate</span></div>
      <div class="row">
        <span class="text-sm text-muted" id="who"></span>
        <button class="btn btn-outline btn-sm" type="button" onclick="logout()">Sign out</button>
      </div>
    </header>

    <div class="staff-main gate">
      <div class="card" data-reveal>
        <div class="card-header">
          <div class="badge badge-ok" style="margin-bottom:0.45rem">ATTENDANT</div>
          <h2 class="card-title">Token check-in / out</h2>
          <p class="text-muted text-sm">Scan or type the confirmation token from the booking.</p>
        </div>
        <div id="msg" hidden></div>
        <div class="field">
          <label for="token">Confirmation token</label>
          <input id="token" placeholder="e.g. A1B2C3D4E5F6G7H8" />
        </div>
        <div class="row">
          <button class="btn btn-accent" id="btnIn" type="button">Check in</button>
          <button class="btn btn-secondary" id="btnOut" type="button">Check out</button>
        </div>
        <pre class="quote" id="out"></pre>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=9"></script>
  <script>
    requireAuth(["ATTENDANT", "ADMIN"]).then((d) => {
      if (d) qs("#who").textContent = d.user.fullName;
    });
    async function gate(path) {
      try {
        const data = await API.post("/api/gate/" + path, { token: qs("#token").value });
        showMsg(qs("#msg"), path + " ok · reservation #" + data.reservation.reservationId, true);
        qs("#out").textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        showMsg(qs("#msg"), e.message, false);
      }
    }
    qs("#btnIn").onclick = () => gate("checkin");
    qs("#btnOut").onclick = () => gate("checkout");
  </script>
</body>
</html>
